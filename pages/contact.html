<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/common-styles.css" />
    <link rel="stylesheet" href="../styles/contact-styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>contact</title>
  </head>

  <body>
    <div class="nav-menu" style="background-color: white">
      <div class="logo">
        <a
          href="https://wordpress.org/themes/hestia/"
          target="_blank"
          style="color: black"
        >
          Hestia
        </a>
      </div>
      <div class="links">
        <a href="../index.html" style="color: black">HOME</a>
        <a href="blog.html" style="color: black">BLOG</a>
        <a href="contact.html" style="color: black">CONTACT</a>
        <a class="more" onclick="scrollToTarget()">MORE</a>
      </div>
    </div>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24284.725523976143!2d-109.53881875!3d40.4621954!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874562357bef9a73%3A0x5b474db698829a5c!2sDinosaur%20Inn!5e0!3m2!1sen!2sus!4v1719206790294!5m2!1sen!2sus"
      width="100%"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      %
      referrerpolicy="no-referrer-when-downgrade"
    >
    </iframe>

    <div class="contact-container">
      <div class="message">
        <h1>Send us a Message</h1>
        <input type="text" placeholder="Your name.." name="fname" />
        <input type="text" placeholder="Your last name.." name="lname" />
        <input type="textbox" name="message" placeholder="Write something.." />
        <a class="submit-contact-button">SUBMIT</a>
      </div>

      <div class="contact-info">
        <div class="title">
          <i class="fa-solid fa-map"></i>
          <h4>Find us at the office</h4>
        </div>
        <p>Strada Povernei, nr 20</p>
        <p>Bucharest</p>
        <p>Romania</p>

        <div class="title">
          <i class="fa-solid fa-phone"></i>
          <h4>Give us a ring</h4>
        </div>
        <p>John Doe</p>
        <p>+40 712 345 678</p>
        <p>Mon - Fri, 8:00-22:00</p>

        <div class="title">
          <i class="fa-solid fa-briefcase"></i>
          <h4>Legal information</h4>
        </div>
        <p>John Doe Co.</p>
        <p>Fiscal Code: 12345678</p>
      </div>
    </div>

    <footer>
      <div class="footer-links">
        <a href="../index.html">ABOUT</a>
        <a href="./parent.html">PARENT PAGE</a>
      </div>
      <div class="footer-links-other">
        <a href="../index.html">Hestia</a>
        <a href="../index.html">Developed by ThemeIsle</a>
      </div>
    </footer>
    <script src="../scripts/scroll.js"></script>
  </body>
</html>
